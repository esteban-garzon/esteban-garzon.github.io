# =============================================================================
# Travel map data -- the single source of geographic truth for /travel-map/.
#
# Cities are grouped by country and listed in the order they should appear in
# the breakdown below the map. Coordinates are decimal degrees (WGS84); the page
# projects them with the same equirectangular formula used by
# scripts/build_world_map.py, so nothing needs to be recomputed by hand.
#
#   kind:   conference | invited | visiting
#   status: in-person | virtual | upcoming
#
# Only `in-person` and `upcoming` visits are plotted. A city whose visits are
# all `virtual` disappears from the map but is still listed, marked as remote.
#
# At world scale the Italian cities overlap, so only cities outside Europe carry
# a printed label; the rest are named by their tooltip and by the breakdown list
# rendered under the map.
#
# =============================================================================

